version: 2

models:
  - name: int_application_events
    description: >
      Grain: one CDC event (same as stg_applications_cdc), enriched with window-function ranks
      (latest by event time, latest by ingest time, first event) and per-application flags
      (resolved real customer, deleted). No filtering; used only by fct_application.
    columns:
      - name: rn_event_desc
        description: "1 = latest version by business time (A2); tie-breaks: ingest time, I<U<D, real customer first."
      - name: resolved_customer_id
        description: "The single non-placeholder customer_id seen on the application (A4). NULL if none."
      - name: application_deleted
        description: "True if any event of the application is a CDC delete (A3)."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments: {expression: "rn_event_desc >= 1 and rn_ingest_desc >= 1 and rn_event_asc >= 1"}
          config: {meta: {dq_dimension: validity}}

  - name: int_fx_daily
    description: >
      Grain: one row per calendar day x currency, from the first published rate to the later of
      the last published rate and snapshot_date. units_per_usd is forward-filled from the last
      published rate on or before the day (A7, F12); rate_source_date and days_stale make the
      fill auditable. is_published marks the days the provider actually published.
    columns:
      - name: units_per_usd
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
              config: {meta: {dq_dimension: validity}}
      - name: rate_source_date
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: days_stale
        description: Days since the rate was published. 0 on published days; up to 4 over a long weekend.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 5}
              config: {meta: {dq_dimension: timeliness}}
      - name: currency
        data_tests:
          - accepted_values:
              arguments: {values: ['COP', 'BRL']}
              config: {meta: {dq_dimension: validity}}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [rate_date, currency]}
          config: {meta: {dq_dimension: uniqueness}}
      - dbt_utils.expression_is_true:
          arguments: {expression: "rate_source_date <= rate_date"}
          config: {meta: {dq_dimension: timeliness}}
      - dbt_utils.expression_is_true:
          arguments: {expression: "not is_published or days_stale = 0"}
          config: {meta: {dq_dimension: consistency}}

  - name: int_loan_validated
    description: >
      Grain: one row per loan as delivered (28,075). Adds the application's key attributes,
      the validity verdict (A5) and exclusion_reason for loans that fct_loan drops (F7).
    columns:
      - name: loan_id
        data_tests:
          - unique: {config: {meta: {dq_dimension: uniqueness}}}
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: exclusion_reason
        data_tests:
          - accepted_values:
              arguments: {values: ['NO_APPLICATION', 'APPLICATION_DELETED', 'APPLICATION_NOT_APPROVED']}
              config: {meta: {dq_dimension: validity}}
    data_tests:
      # excluded if and only if a reason is recorded
      - dbt_utils.expression_is_true:
          arguments: {expression: "is_valid = (exclusion_reason is null)"}
          config: {meta: {dq_dimension: consistency}}

  - name: int_payment_classified
    description: >
      Grain: one row per payment_id from staging (110,136), with payment_class
      (EFFECTIVE / REVERSED_OUT / REVERSAL_ROW, A9), the number of reversal rows pointing at
      it (F11) and the validity of its loan (A5). Nothing is dropped.
    columns:
      - name: payment_id
        data_tests:
          - unique: {config: {meta: {dq_dimension: uniqueness}}}
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: payment_class
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - accepted_values:
              arguments: {values: ['EFFECTIVE', 'REVERSED_OUT', 'REVERSAL_ROW']}
              config: {meta: {dq_dimension: validity}}
    data_tests:
      # a voided payment is voided by at least one row; an effective one by none
      - dbt_utils.expression_is_true:
          arguments: {expression: "(payment_class = 'REVERSED_OUT') = (n_reversal_rows >= 1)"}
          config: {meta: {dq_dimension: consistency}}
      # every payment references a loan we know (F10 normalisation worked)
      - dbt_utils.expression_is_true:
          arguments: {expression: "not loan_missing"}
          config: {meta: {dq_dimension: integrity}}
      # a reversal voids a payment of the same absolute amount (F11)
      - dbt_utils.expression_is_true:
          arguments: {expression: "payment_class <> 'REVERSED_OUT' or abs(reversal_amount_total) >= amount"}
          config: {meta: {dq_dimension: accuracy}}

  - name: int_payment_allocation
    description: >
      Grain: one row per (payment_id, installment_number) pair funded by the payment: the FIFO
      allocation of loan-level payments to the installment plan (A21), computed as the overlap
      of cumulative payment intervals with cumulative installment intervals. Full history
      (no snapshot cut). Overpayment beyond the plan total is not allocated.
    columns:
      - name: allocated_amount
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
              config: {meta: {dq_dimension: validity}}
      - name: payment_id
        data_tests:
          - relationships:
              arguments: {to: ref('fct_payment'), field: payment_id}
              config: {meta: {dq_dimension: integrity}}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [payment_id, installment_number]}
          config: {meta: {dq_dimension: uniqueness}}
      # a single allocation never exceeds either side of the overlap
      - dbt_utils.expression_is_true:
          arguments: {expression: "allocated_amount <= payment_amount and allocated_amount <= amount_due"}
          config: {meta: {dq_dimension: accuracy}}
      # the intervals really overlap
      - dbt_utils.expression_is_true:
          arguments: {expression: "cum_paid_start < cum_due_end and cum_paid_end > cum_due_start"}
          config: {meta: {dq_dimension: consistency}}

  - name: int_loan_month_end_status
    description: >
      Grain: one row per valid loan x month end, from the disbursement month to the snapshot
      month (A13). Outstanding balance (A11), DPD (A24), PAR30 flag and USD at the month-end FX
      rate (A12), derived from settled_date_any without re-running the FIFO. At the snapshot
      month end it reproduces dm_loan_delinquency_snapshot loan by loan.
    columns:
      - name: loan_id
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - relationships:
              arguments: {to: ref('fct_loan'), field: loan_id}
              config: {meta: {dq_dimension: integrity}}
      - name: outstanding_local
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
              config: {meta: {dq_dimension: validity}}
      - name: outstanding_usd
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: dpd
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
              config: {meta: {dq_dimension: validity}}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [loan_id, month_end]}
          config: {meta: {dq_dimension: uniqueness}}
      - dbt_utils.expression_is_true:
          arguments: {expression: "month_end >= disbursed_date"}
          config: {meta: {dq_dimension: timeliness}}
      - dbt_utils.expression_is_true:
          arguments: {expression: "(dpd > 0) = (n_overdue > 0) and is_par30 = (dpd > 30)"}
          config: {meta: {dq_dimension: consistency}}
