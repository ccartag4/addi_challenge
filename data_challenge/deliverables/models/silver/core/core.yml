version: 2

# Core entities contract. Every test carries config.meta.dq_dimension (DAMA-DMBOK).

models:
  - name: fct_application
    description: >
      Grain: one row per application_id, in its final state (latest CDC event by business
      time, A2). Contains every application including deleted ones; is_valid excludes deletes
      (A3) and is_approved additionally requires final_status = APPROVED. customer_id is the
      resolved real customer (A4). created_date/created_month come from the first event in
      Bogotá time (A6, A14). is_out_of_order flags applications whose final status would differ
      if ordered by ingest time (F6).
    columns:
      - name: application_id
        data_tests:
          - unique: {config: {meta: {dq_dimension: uniqueness}}}
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: customer_id
        description: Resolved real customer. NULL only when every event carried the placeholder.
        data_tests:
          - relationships:
              arguments: {to: ref('stg_customers'), field: customer_id}
              config:
                meta: {dq_dimension: integrity}
                where: "customer_id is not null"
      - name: merchant_id
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - relationships:
              arguments: {to: ref('stg_merchants_history'), field: merchant_id}
              config: {meta: {dq_dimension: integrity}}
      - name: final_status
        data_tests:
          - accepted_values:
              arguments: {values: ['CREATED', 'APPROVED', 'REJECTED']}
              config: {meta: {dq_dimension: validity}}
      - name: currency
        data_tests:
          - accepted_values:
              arguments: {values: ['COP', 'BRL']}
              config: {meta: {dq_dimension: validity}}
      - name: created_date
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: n_events
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
              config: {meta: {dq_dimension: validity}}
    data_tests:
      # A3: a deleted application is never valid
      - dbt_utils.expression_is_true:
          arguments: {expression: "not (is_deleted and is_valid)"}
          config: {meta: {dq_dimension: validity}}
      # every valid application reached a decision (no dangling CREATED)
      - dbt_utils.expression_is_true:
          arguments: {expression: "not is_valid or final_status in ('APPROVED', 'REJECTED')"}
          config: {meta: {dq_dimension: completeness}}
      # an approved application carries an approved amount, never above the requested one
      - dbt_utils.expression_is_true:
          arguments: {expression: "not is_approved or (approved_amount is not null and approved_amount <= requested_amount)"}
          config: {meta: {dq_dimension: accuracy}}
      # decision cannot precede creation
      - dbt_utils.expression_is_true:
          arguments: {expression: "decided_at_utc is null or decided_at_utc >= created_at_utc"}
          config: {meta: {dq_dimension: timeliness}}
      # A4 residue: a valid application should have a real customer (warn: expected residue is tiny)
      - dbt_utils.expression_is_true:
          arguments: {expression: "not is_valid or customer_id is not null"}
          config:
            meta: {dq_dimension: integrity}
            severity: warn

  - name: dim_merchant
    description: >
      Grain: one row per merchant version (merchant_id x valid_from). SCD type 2 built from the
      append-only history (F15): valid_to is the day before the next version starts and NULL
      for the current version; valid_to_effective replaces NULL with 9999-12-31 for range
      joins; is_current flags the latest version. Historical reports must join on the event
      date (A14) to get the category in effect at the time.
    columns:
      - name: merchant_sk
        description: Surrogate key of the version (hash of merchant_id, valid_from).
        data_tests:
          - unique: {config: {meta: {dq_dimension: uniqueness}}}
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: merchant_id
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: valid_from
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: valid_to
        description: NULL for the current version.
      - name: is_current
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: category
        description: >
          Category in effect for the version. Source gaps (F17) are filled per A17: carried
          forward from the merchant's earlier version, or UNKNOWN when none exists. See
          category_source / category_imputation for the raw value and the rule applied.
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - accepted_values:
              arguments: {values: ['HOME', 'HEALTH', 'FASHION', 'ELECTRONICS', 'MOTORCYCLES', 'EDUCATION', 'TRAVEL', 'UNKNOWN']}
              config: {meta: {dq_dimension: validity}}
      - name: category_source
        description: Category exactly as delivered; NULL on the 16 gap rows (F17).
      - name: category_imputation
        description: NULL when category_source was present; otherwise the rule that filled it.
        data_tests:
          - accepted_values:
              arguments: {values: ['CARRIED_FORWARD', 'UNKNOWN']}
              config: {meta: {dq_dimension: validity}}
      - name: country
        data_tests:
          - accepted_values:
              arguments: {values: ['CO', 'BR']}
              config: {meta: {dq_dimension: validity}}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [merchant_id, valid_from]}
          config: {meta: {dq_dimension: uniqueness}}
      # A17: imputation is recorded whenever the source category was missing, and only then
      - dbt_utils.expression_is_true:
          arguments: {expression: "(category_source is null) = (category_imputation is not null)"}
          config: {meta: {dq_dimension: consistency}}
      # a version never ends before it starts
      - dbt_utils.expression_is_true:
          arguments: {expression: "valid_to is null or valid_to >= valid_from"}
          config: {meta: {dq_dimension: validity}}
      # the current version is the last one
      - dbt_utils.expression_is_true:
          arguments: {expression: "is_current = (version_number = n_versions)"}
          config: {meta: {dq_dimension: consistency}}

  - name: dim_customer
    description: >
      Grain: one row per real person, identified by document_number (A1). Attributes come from
      the person's most recently created customer record (A18). n_customer_ids and the
      has_* flags describe the collapse from customer_ids to people (F13): 907 redundant ids,
      346 people with ids in two countries, 886 with conflicting birth years. city is the
      canonical name from the city_canonical seed.
    columns:
      - name: person_sk
        description: Surrogate key of the person (hash of document_number).
        data_tests:
          - unique: {config: {meta: {dq_dimension: uniqueness}}}
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: document_number
        data_tests:
          - unique: {config: {meta: {dq_dimension: uniqueness}}}
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: latest_customer_id
        data_tests:
          - unique: {config: {meta: {dq_dimension: uniqueness}}}
          - relationships:
              arguments: {to: ref('stg_customers'), field: customer_id}
              config: {meta: {dq_dimension: integrity}}
      - name: country
        data_tests:
          - accepted_values:
              arguments: {values: ['CO', 'BR']}
              config: {meta: {dq_dimension: validity}}
      - name: city_key
        description: Every key must exist in the seed; a new spelling fails this test.
        data_tests:
          - relationships:
              arguments: {to: ref('city_canonical'), field: city_key}
              config: {meta: {dq_dimension: integrity}}
      - name: n_customer_ids
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
              config: {meta: {dq_dimension: validity}}
    data_tests:
      - dbt_utils.expression_is_true:
          arguments: {expression: "has_duplicate_ids = (n_customer_ids > 1)"}
          config: {meta: {dq_dimension: consistency}}
      - dbt_utils.expression_is_true:
          arguments: {expression: "first_created_date <= last_created_date"}
          config: {meta: {dq_dimension: timeliness}}

  - name: fct_loan
    description: >
      Grain: one row per valid loan (A5). principal_usd = principal / units_per_usd at the
      Bogotá disbursement date (A6, A7), with fx_rate_source_date and fx_days_stale exposing the
      forward fill. merchant_sk / merchant_category_at_disbursement are the SCD2 version in
      effect on the disbursement date (A14). customer_id is the application's resolved real
      customer (A4, A19); loan_customer_id keeps the loan's own value. Installment summary
      columns come from the plan (F16).
    columns:
      - name: loan_id
        data_tests:
          - unique: {config: {meta: {dq_dimension: uniqueness}}}
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: application_id
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - unique: {config: {meta: {dq_dimension: uniqueness}}}
          - relationships:
              arguments: {to: ref('fct_application'), field: application_id}
              config: {meta: {dq_dimension: integrity}}
      - name: customer_id
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - relationships:
              arguments: {to: ref('stg_customers'), field: customer_id}
              config: {meta: {dq_dimension: integrity}}
      - name: person_sk
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - relationships:
              arguments: {to: ref('dim_customer'), field: person_sk}
              config: {meta: {dq_dimension: integrity}}
      - name: merchant_sk
        description: Exactly one SCD2 version must cover the disbursement date.
        data_tests:
          - not_null: {config: {meta: {dq_dimension: integrity}}}
          - relationships:
              arguments: {to: ref('dim_merchant'), field: merchant_sk}
              config: {meta: {dq_dimension: integrity}}
      - name: principal_usd
        description: principal / fx_units_per_usd, 6 decimals; round only at presentation.
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
              config: {meta: {dq_dimension: validity}}
      - name: fx_units_per_usd
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
      - name: fx_days_stale
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 5}
              config: {meta: {dq_dimension: timeliness}}
      - name: currency
        data_tests:
          - accepted_values:
              arguments: {values: ['COP', 'BRL']}
              config: {meta: {dq_dimension: validity}}
      - name: disbursed_date
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
    data_tests:
      # F8 / A5: the loan mirrors its application
      - dbt_utils.expression_is_true:
          arguments: {expression: "principal = approved_amount"}
          config: {meta: {dq_dimension: accuracy}}
      # F16: the installment plan matches the term
      - dbt_utils.expression_is_true:
          arguments: {expression: "n_installments = term_months"}
          config: {meta: {dq_dimension: consistency}}
      # the plan repays at least the principal
      - dbt_utils.expression_is_true:
          arguments: {expression: "total_amount_due >= principal"}
          config: {meta: {dq_dimension: accuracy}}
      # a loan cannot be disbursed before its application was created
      - dbt_utils.expression_is_true:
          arguments: {expression: "disbursed_date >= application_created_date"}
          config: {meta: {dq_dimension: timeliness}}
      # the first installment is due after disbursement
      - dbt_utils.expression_is_true:
          arguments: {expression: "first_due_date > disbursed_date"}
          config: {meta: {dq_dimension: timeliness}}

  - name: bridge_customer_person
    description: >
      Grain: one row per customer_id, mapped to its person_sk. Facts keep the source
      customer_id; person-level analysis joins through this bridge.
    columns:
      - name: customer_id
        data_tests:
          - unique: {config: {meta: {dq_dimension: uniqueness}}}
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - relationships:
              arguments: {to: ref('stg_customers'), field: customer_id}
              config: {meta: {dq_dimension: integrity}}
      - name: person_sk
        data_tests:
          - not_null: {config: {meta: {dq_dimension: completeness}}}
          - relationships:
              arguments: {to: ref('dim_customer'), field: person_sk}
              config: {meta: {dq_dimension: integrity}}
