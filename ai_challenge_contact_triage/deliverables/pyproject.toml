[project]
name = "lumo-triage"
version = "0.1.0"
description = "Contact triage and grounded reply drafting for Lumo's CX team (AI challenge)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: calls the real Anthropic API (needs a key and LUMO_LIVE_TESTS=1); skipped otherwise",
]
