# Routing policy — turns (reason, flags, confidence, policy coverage) into (action, queue,
# priority). Deterministic and editable by the CX team without touching prompts.
# Evaluation order: overrides first (first match wins), then the reason defaults from
# taxonomy.yaml, then priority bumps. Every decision records the reason codes that fired.

version: 2

confidence_threshold: 0.60      # below this, the classification is not trusted: a person decides

actions:
  auto_reply:            Send the draft; no human involved.
  auto_reply_and_route:  Send the draft as an acknowledgement and open a case in the queue.
  route_to_human:        No draft; a person answers from the queue.
  close_no_reply:        Close the ticket; nothing to answer.

queues:
  fraude:              Fraud and security team; blocks access and investigates.
  cartera:             Collections; payment agreements, refinancing, bureau-report claims.
  pagos_conciliacion:  Payments; unapplied payments, double charges, fee disputes.
  soporte_tecnico:     App and access issues that the standard steps do not fix.
  pqr_legal:           Formal complaints, legal threats, harassment complaints.
  datos_privacidad:    Habeas data and personal-data requests (legal owner).
  onboarding:          Credit application status.
  comercial:           Sales inquiries about products.
  cx_general:          General queue for anything else a person must handle.
  none:                No queue.

# Overrides, evaluated in this order; the first whose condition holds decides action/queue and
# sets a minimum priority. `no_draft: true` suppresses any LLM draft; `template` names a fixed
# Spanish reply from templates below.
overrides:
  - code: OVR_INJECTION
    when: {flag: prompt_injection_suspected}
    action: route_to_human
    queue: cx_general
    min_priority: P2
    no_draft: true
    why: A message that tries to instruct the assistant is never auto-answered.

  - code: OVR_FRAUD
    when: {flag: fraud_or_security}
    action: auto_reply_and_route
    queue: fraude
    min_priority: P0
    template: security_ack
    why: Security cases get an immediate fixed acknowledgement and the fraud team, whatever the reason label says.

  - code: OVR_HUMAN
    when: {flag: requests_human}
    action: route_to_human
    queue: reason_default_or_cx_general
    min_priority: P2
    no_draft: true
    why: An explicit request for a person is honoured; the reason still picks the queue.

  - code: OVR_LEGAL
    when: {any_flag: [legal_threat, collections_harassment]}
    action: auto_reply_and_route
    queue: pqr_legal
    min_priority: P1
    extra_sections: [datos_certificados_pqr.pqr]
    why: Legal exposure is handled by PQR/Legal; the PQR acknowledgement can still be sent, so the PQR section is added to the sections the draft may cite.

  - code: OVR_HABEAS
    when: {any_reason: privacidad_habeas_data}
    action: auto_reply_and_route
    queue: datos_privacidad
    min_priority: P2
    why: A data-deletion, data-access or marketing opt-out request is a legal obligation (Ley 1581 de 2012) whether it is the first or the second request in the message; the privacy owner gets the case and a draft may still answer the covered part (for example the cancellation steps).

  - code: OVR_LOW_CONFIDENCE
    when: {confidence_below_threshold: true}
    action: route_to_human
    queue: reason_default_or_cx_general
    min_priority: P3
    no_draft: true
    why: The classifier is not sure; a person decides.

  - code: OVR_NO_POLICY
    when: {policy_coverage: none, reply_source: none}
    action: route_to_human
    queue: reason_default_or_cx_general
    min_priority: P3
    no_draft: true
    why: No policy means no grounded draft is possible; the gap itself is reported. Reasons that answer with a fixed template (fuera_de_alcance) are not affected.

  - code: OVR_OOS_SALES
    when: {reason: fuera_de_alcance, out_of_scope_kind: other_business_inquiry}
    action: route_to_human
    queue: comercial
    min_priority: P3
    no_draft: true
    why: Product questions are for sales, not for a courtesy template.

# Priority bumps applied after the base/min priority. `levels`: move that many levels towards
# P0 (never past it). `floor`: the least urgent level allowed once the flag is present, i.e. the
# result is at least this urgent. The highest base priority among primary and secondary reasons
# is used before any bump (code PRIO_SECONDARY_<reason>).
priority_bumps:
  vulnerable_customer: {levels: 1, floor: P1}
  imminent_deadline:   {levels: 1}
  repeat_contact:      {levels: 1}

# Verifier rules for LLM drafts (code, not prompt). A failed check downgrades the action to
# route_to_human with reason code VERIFIER_<check>.
verifier:
  require_citations: true
  numbers_must_appear_in_cited_sections: true
  forbidden_phrases:
    - condonaci
    - "te devolvemos"
    - "le devolvemos"
    - "reembolso confirmado"
    - "borramos el historial"
    - "eliminamos el reporte"
    - "quitamos el reporte"
    - "no te reportaremos"
    - "no lo reportaremos"
    - "envianos tu contrase"
    - "compartenos tu contrase"
    - "envianos tu clave"
    - "dinos tu codigo"
    - "envianos el codigo"
    - "numero de tu tarjeta"
  never_echo_entities: [document_number]
  max_words: 160
  min_words: 8
  language: es

# Which fixed reply a reason with reply_source == template uses (overrides may name their own).
reason_templates:
  saludo_incompleto: greeting_prompt
  felicitacion_feedback: feedback_thanks
  fuera_de_alcance: unrelated

# Sections a fixed reply is grounded in (for the output's kb_citations).
template_citations:
  security_ack: [cuenta_app_seguridad.fraude_seguridad]

# How a draft may name the team that receives the case (Spanish, customer-facing).
queue_labels_es:
  fraude: el equipo de seguridad
  cartera: el equipo de Cartera
  pagos_conciliacion: el equipo de Pagos
  soporte_tecnico: soporte técnico
  pqr_legal: el equipo de PQR
  datos_privacidad: el equipo de protección de datos
  onboarding: el equipo de solicitudes
  comercial: el equipo comercial
  cx_general: un asesor

# Fixed Spanish replies (no model call; the verifier still checks phrases, length and echoes).
templates:
  security_ack: >
    Gracias por avisarnos. Por seguridad, no compartas tu clave, tu código de verificación ni
    datos de tarjeta con nadie; Lumo nunca los pide por SMS, correo o enlaces. Estamos escalando
    tu caso de inmediato al equipo de seguridad para bloquear el acceso a tu cuenta y revisar lo
    ocurrido. Un asesor se comunicará contigo por este mismo canal.
  greeting_prompt: >
    ¡Hola! Gracias por escribir a Lumo. Cuéntanos en qué podemos ayudarte: por ejemplo, tu fecha
    de pago, un pago que no se refleja, acceso a la app, certificados o cualquier otra consulta
    sobre tu crédito.
  unrelated: >
    Hola, gracias por escribir. Este es el canal de atención de Lumo para consultas sobre tu
    crédito, pagos y la app. Si necesitas ayuda con alguno de esos temas, cuéntanos y con gusto
    te apoyamos.
  feedback_thanks: >
    ¡Muchas gracias por tus palabras! Compartiremos tu mensaje con el equipo. Si en algún momento
    necesitas ayuda con tu crédito, escríbenos por este canal.
